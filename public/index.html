<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpinePA Agent</title>
<style>
body{
  font-family:Arial,Helvetica,sans-serif;
  margin:0;
  background:#f6f7fb;
  color:#333;
}
.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:220px;
  background:#0f2a44;
  color:white;
  padding:20px;
}
.sidebar h2{
  margin-top:0;
  font-size:20px;
}
.sidebar .badge{
  display:inline-block;
  background:#1f8a70;
  color:white;
  font-size:12px;
  padding:4px 8px;
  border-radius:12px;
  margin-top:8px;
}
.sidebar a{
  display:block;
  color:white;
  text-decoration:none;
  margin:14px 0;
  opacity:.9;
}
.sidebar a:hover{
  opacity:1;
}
.main{
  margin-left:240px;
  padding:32px;
}
h1{
  margin-top:0;
}
.card{
  background:white;
  border-radius:10px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}
.card h3{
  margin-top:0;
  margin-bottom:18px;
}
.form-row{
  display:flex;
  gap:16px;
  margin-bottom:16px;
}
.form-group{
  flex:1;
}
label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
  color:#5a6472;
  text-transform:uppercase;
  letter-spacing:.03em;
}
input,select,textarea{
  width:100%;
  box-sizing:border-box;
  padding:10px 12px;
  border:1px solid #cfd6df;
  border-radius:6px;
  font-size:14px;
  background:white;
}
textarea{
  min-height:180px;
  resize:vertical;
}
.button-row{
  display:flex;
  gap:12px;
  margin-top:8px;
  margin-bottom:20px;
}
button{
  background:#127c71;
  border:none;
  color:white;
  padding:12px 18px;
  border-radius:6px;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
}
button:hover{
  background:#0f6b61;
}
button.secondary{
  background:#234e7d;
}
button.secondary:hover{
  background:#1d426a;
}
button:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.status-line{
  font-size:13px;
  color:#6b7280;
  margin-bottom:12px;
}
.result{
  white-space:pre-wrap;
  background:#f7faff;
  border:1px solid #d8e4ff;
  padding:16px;
  border-radius:8px;
  min-height:120px;
}
.small-note{
  font-size:12px;
  color:#6b7280;
  margin-top:6px;
}
</style>
</head>
<body>

<div class="sidebar">
  <h2>🦴 SpinePA Agent</h2>
  <div class="badge">Demo Mode</div>

  <div style="margin-top:28px;">
    <a href="#">Dashboard</a>
    <a href="#">New PA Request</a>
    <a href="#">PA Queue</a>
  </div>

  <div style="margin-top:28px;">
    <a href="#">Payer Criteria</a>
    <a href="#">Settings</a>
  </div>

  <div id="practiceName" style="margin-top:28px;font-size:13px;opacity:.9;"></div>
</div>

<div class="main">
  <div class="status-line">Submit a new prior authorization request</div>
  <h1>New PA Request</h1>

  <div class="card">
    <h3>Patient Information</h3>

    <div class="form-row">
      <div class="form-group">
        <label for="firstName">Patient First Name</label>
        <input id="firstName" value="Linda">
      </div>
      <div class="form-group">
        <label for="lastName">Patient Last Name</label>
        <input id="lastName" value="Park">
      </div>
      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input id="dob" value="01/01/1965">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="insurance">Insurance / Payer</label>
        <input id="insurance" value="Aetna">
      </div>
      <div class="form-group">
        <label for="member">Member ID</label>
        <input id="member" value="ssddsADs">
      </div>
      <div class="form-group">
        <label for="referring">Referring Provider</label>
        <input id="referring" value="Dr. James Carter">
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Procedure Request</h3>

    <div class="form-row">
      <div class="form-group">
        <label for="procedure">Procedure Type</label>
        <select id="procedure">
          <option value="mri">Lumbar MRI (CPT 72148)</option>
          <option value="cervical_mri">Cervical MRI</option>
          <option value="esi">Epidural Steroid Injection</option>
          <option value="fusion">Lumbar Fusion</option>
        </select>
      </div>
      <div class="form-group">
        <label for="dx">Primary Diagnosis (ICD-10)</label>
        <input id="dx" value="M54.5 — Low Back Pain">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="pain">Pain Score (VAS 0–10)</label>
        <select id="pain">
          <option>1</option><option>2</option><option>3</option><option>4</option>
          <option selected>5</option>
          <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
        </select>
      </div>
      <div class="form-group">
        <label for="duration">Duration of Symptoms</label>
        <select id="duration">
          <option>1–2 weeks</option>
          <option selected>4–6 weeks</option>
          <option>6–12 weeks</option>
          <option>3+ months</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Ordering Provider</h3>

    <div class="form-row">
      <div class="form-group">
        <label for="orderingProvider">Provider</label>
        <select id="orderingProvider">
          <option value="">Loading providers...</option>
        </select>
      </div>
      <div class="form-group">
        <label for="providerNpi">Provider NPI</label>
        <input id="providerNpi" type="text" readonly>
        <div class="small-note">Auto-filled from configured clinic providers</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Clinical Notes</h3>
    <textarea id="notes">Patient with persistent low back pain despite conservative therapy including PT and NSAIDs. Symptoms worsen with standing and walking. Neurologic symptoms include intermittent radicular pain.</textarea>
  </div>

  <div class="button-row">
    <button id="analyzeBtn" onclick="analyzeRequest()">Analyze with AI</button>
    <button id="letterBtn" class="secondary" onclick="generateLetter()">Generate Authorization Letter</button>
  </div>

  <div class="card">
    <h3>Result</h3>
    <div id="result" class="result">Ready.</div>
  </div>
</div>

<script>
let providerDirectory = [];

async function loadAppStatus() {
  try {
    const res = await fetch("/status");
    const status = await res.json();

    document.getElementById("practiceName").innerText =
      status.practice_name || "";

    providerDirectory = Array.isArray(status.providers) ? status.providers : [];

    const providerSelect = document.getElementById("orderingProvider");
    const providerNpiInput = document.getElementById("providerNpi");

    providerSelect.innerHTML = "";

    if (providerDirectory.length === 0) {
      const opt = document.createElement("option");
      opt.value = status.provider_name || "";
      opt.textContent = status.provider_name || "No providers configured";
      providerSelect.appendChild(opt);
      providerSelect.value = status.provider_name || "";
      providerNpiInput.value = status.npi || "";
    } else {
      providerDirectory.forEach((provider) => {
        const opt = document.createElement("option");
        opt.value = provider.name;
        opt.textContent = provider.name;
        providerSelect.appendChild(opt);
      });

      const defaultProvider =
        status.provider_name &&
        providerDirectory.some((p) => p.name === status.provider_name)
          ? status.provider_name
          : providerDirectory[0].name;

      providerSelect.value = defaultProvider;
      updateProviderNpi();
    }

    providerSelect.addEventListener("change", updateProviderNpi);
  } catch (err) {
    console.error("Failed to load /status:", err);
    document.getElementById("result").innerText =
      "Could not load clinic/provider settings.";
  }
}

function updateProviderNpi() {
  const providerSelect = document.getElementById("orderingProvider");
  const providerNpiInput = document.getElementById("providerNpi");
  const selected = providerDirectory.find((p) => p.name === providerSelect.value);
  providerNpiInput.value = selected ? selected.npi : "";
}

function getRequestPayload() {
  const firstName = document.getElementById("firstName").value || "";
  const lastName = document.getElementById("lastName").value || "";
  const patient = `${firstName} ${lastName}`.trim();

  return {
    patient,
    payer: document.getElementById("insurance").value || "",
    notes: document.getElementById("notes").value || "",
    proc_type: document.getElementById("procedure").value || "",
    provider: document.getElementById("orderingProvider")?.value || "",
    provider_npi: document.getElementById("providerNpi")?.value || "",
    diagnosis: document.getElementById("dx").value || "",
    pain_score: document.getElementById("pain").value || "",
    duration: document.getElementById("duration").value || "",
    member_id: document.getElementById("member").value || "",
    dob: document.getElementById("dob").value || "",
    referring_provider: document.getElementById("referring").value || ""
  };
}

async function analyzeRequest() {
  const resultBox = document.getElementById("result");
  const analyzeBtn = document.getElementById("analyzeBtn");

  try {
    analyzeBtn.disabled = true;
    resultBox.innerText = "Analyzing...";

    const payload = getRequestPayload();

    const res = await fetch("/analyze", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (!res.ok) {
      resultBox.innerText = "AI Error:\n" + JSON.stringify(data, null, 2);
      return;
    }

    if (data.analysis) {
      resultBox.innerText = data.analysis;
    } else {
      resultBox.innerText = JSON.stringify(data, null, 2);
    }
  } catch (err) {
    resultBox.innerText = "Request failed: " + err;
  } finally {
    analyzeBtn.disabled = false;
  }
}

async function generateLetter() {
  const resultBox = document.getElementById("result");
  const letterBtn = document.getElementById("letterBtn");

  try {
    letterBtn.disabled = true;
    resultBox.innerText = "Generating authorization letter...";

    const payload = getRequestPayload();

    const res = await fetch("/generate-letter", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        notes: payload.notes,
        payer: payload.payer,
        patient: payload.patient,
        provider: payload.provider,
        provider_npi: payload.provider_npi
      })
    });

    const data = await res.json();

    if (!res.ok) {
      resultBox.innerText = "Letter Error:\n" + JSON.stringify(data, null, 2);
      return;
    }

    resultBox.innerText = data.letter || JSON.stringify(data, null, 2);
  } catch (err) {
    resultBox.innerText = "Request failed: " + err;
  } finally {
    letterBtn.disabled = false;
  }
}

loadAppStatus();
</script>
</body>
</html>
