<!DOCTYPE html>
<html>
<head>
<title>SpinePA Agent</title>

<style>
body{font-family:Arial;margin:40px;background:#f5f6fa}

input,select,textarea{
width:100%;
padding:8px;
margin:5px 0 15px
}

button{
padding:10px 18px;
background:#1B3A6B;
color:white;
border:none;
cursor:pointer
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px
}

td,th{
border-bottom:1px solid #ddd;
padding:8px
}

.section{
background:white;
padding:20px;
margin-bottom:20px
}
</style>

</head>

<body>

<h2>SpinePA Agent</h2>

<div class="section">

<h3>New PA Request</h3>

<input id="patient" placeholder="Patient Name">

<input id="dob" type="date">

<input id="memberId" placeholder="Member ID">

<input id="payer" placeholder="Insurance">

<input id="diagnosis" placeholder="Diagnosis">

<input id="procType" placeholder="Procedure">

<input id="provider" placeholder="Provider">

<input id="providerNpi" placeholder="Provider NPI">

<textarea id="notes" placeholder="Clinical notes (optional)"></textarea>

<button onclick="generate()">Generate Letter</button>

<textarea id="letter" style="height:200px"></textarea>

<button onclick="save()">Save Case</button>

</div>


<div class="section">

<h3>PA Repository</h3>

<table id="table">
<thead>
<tr>
<th>Patient</th>
<th>Payer</th>
<th>Procedure</th>
<th>Action</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

<script>

const API=""

function validateDOB(dob){

if(!dob)return true

let d=new Date(dob)
let today=new Date()

if(d>today){
alert("DOB cannot be future")
return false
}

return true
}

function collect(){

return{
patient:patient.value,
dob:dob.value,
memberId:memberId.value,
payer:payer.value,
diagnosis:diagnosis.value,
procType:procType.value,
provider:provider.value,
providerNpi:providerNpi.value,
notes:notes.value
}

}

async function generate(){

let data=collect()

if(!validateDOB(data.dob))return

let r=await fetch(API+"/generate-letter",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify(data)
})

let j=await r.json()

letter.value=j.letter

}

async function save(){

let data=collect()
data.letter=letter.value

await fetch(API+"/cases",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify(data)
})

load()

}

async function load(){

let r=await fetch(API+"/cases")
let j=await r.json()

let body=document.querySelector("#table tbody")

body.innerHTML=""

j.cases.forEach(c=>{

let tr=document.createElement("tr")

tr.innerHTML=`
<td>${c.patient}</td>
<td>${c.payer}</td>
<td>${c.procedure}</td>
<td>
<button onclick="edit(${c.id})">Edit</button>
<button onclick="del(${c.id})">Delete</button>
</td>
`

body.appendChild(tr)

})

}

async function del(id){

await fetch(API+"/cases/"+id,{method:"DELETE"})
load()

}

async function edit(id){

let r=await fetch(API+"/cases")
let j=await r.json()

let c=j.cases.find(x=>x.id==id)

patient.value=c.patient
dob.value=c.dob
memberId.value=c.memberId
payer.value=c.payer
diagnosis.value=c.diagnosis
procType.value=c.procedure
provider.value=c.provider
providerNpi.value=c.providerNpi
notes.value=c.notes
letter.value=c.letter

}

load()

</script>

</body>
</html>
